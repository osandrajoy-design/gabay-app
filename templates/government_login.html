{% extends "base.html" %}
{% block content %}
<div class="auth-container">
  <div class="auth-card role-auth-card">
    <div class="role-auth-badge government-badge">GOVERNMENT PERSONNEL</div>
    <h1>Government Login</h1>
    <p>Sign in to review citizen requests and respond to emergencies.</p>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('government_login') }}" autocomplete="on">
      <label for="gov-email">Government Email</label>
      <input id="gov-email" type="email" name="email" autocomplete="username" required>
      <label for="gov-password">Password</label>
      <input id="gov-password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in as Government Personnel</button>
    </form>
    <div class="role-login-links"><a href="{{ url_for('login') }}">Citizen Login</a><a href="{{ url_for('admin_login') }}">Administrator Login</a></div>
  </div>
</div>
{% endblock %}
